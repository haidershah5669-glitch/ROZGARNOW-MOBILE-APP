<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        .otp-input::-webkit-inner-spin-button,
        .otp-input::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .otp-input {
            -moz-appearance: textfield;
        }
    </style>

<body class="bg-background text-on-background h-full font-body-lg flex flex-col items-center justify-center">
<!-- Main Container -->
<main class="w-full max-w-md mx-auto px-margin-mobile py-xl h-full flex flex-col">
<!-- Top App Bar (Simplified for transactional screen) -->
<header class="w-full top-0 sticky bg-surface border-b border-outline-variant flex justify-between items-center px-margin-mobile py-sm mb-lg shadow-sm">
<button aria-label="Go back" class="text-on-surface-variant hover:bg-surface-container-low active:opacity-80 transition-opacity p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<div class="font-headline-md text-headline-md font-bold text-primary">RozgarNow</div>
<div class="w-10"></div> <!-- Spacer for balance -->
</header>
<!-- Content Area -->
<div class="flex-grow flex flex-col bg-surface-container-lowest rounded-xl shadow-sm p-lg border border-outline-variant">
<!-- Graphic/Icon -->
<div class="flex justify-center mb-lg">
<div class="w-16 h-16 bg-primary-container rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-[32px] text-on-primary-container" style="font-variation-settings: 'FILL' 1;">sms</span>
</div>
</div>
<!-- Header Text -->
<div class="text-center mb-xl">
<h1 class="font-headline-lg text-headline-lg text-on-background mb-xs">Verify Phone</h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                    Enter the 4-digit code sent to <span class="font-semibold text-on-background">+92 300 1234567</span>
</p>
</div>
<!-- OTP Input Fields -->
<form class="flex flex-col gap-lg flex-grow" id="otp-form">
<div aria-label="OTP Input" class="flex justify-center gap-md" role="group">
<input aria-label="Digit 1" autofocus="" class="otp-input w-14 h-16 text-center font-headline-lg text-headline-lg bg-surface border border-outline-variant rounded-lg focus:border-primary focus:ring-2 focus:ring-primary focus:outline-none transition-colors" maxlength="1" pattern="\d*" type="number"/>
<input aria-label="Digit 2" class="otp-input w-14 h-16 text-center font-headline-lg text-headline-lg bg-surface border border-outline-variant rounded-lg focus:border-primary focus:ring-2 focus:ring-primary focus:outline-none transition-colors" maxlength="1" pattern="\d*" type="number"/>
<input aria-label="Digit 3" class="otp-input w-14 h-16 text-center font-headline-lg text-headline-lg bg-surface border border-outline-variant rounded-lg focus:border-primary focus:ring-2 focus:ring-primary focus:outline-none transition-colors" maxlength="1" pattern="\d*" type="number"/>
<input aria-label="Digit 4" class="otp-input w-14 h-16 text-center font-headline-lg text-headline-lg bg-surface border border-outline-variant rounded-lg focus:border-primary focus:ring-2 focus:ring-primary focus:outline-none transition-colors" maxlength="1" pattern="\d*" type="number"/>
</div>
<!-- Timer -->
<div class="text-center mt-sm">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                        Resend code in <span class="font-medium text-primary" id="timer">0:59</span>
</p>
<button class="hidden font-label-md text-label-md text-primary mt-2 hover:underline focus:outline-none" id="resend-btn" type="button">
                        Resend Code
                    </button>
</div>
<!-- Spacer to push button to bottom on smaller screens if needed -->
<div class="flex-grow"></div>
<!-- Primary Action Button -->
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-4 rounded-full shadow-sm hover:bg-surface-tint active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
                    Verify &amp; Continue
                </button>
</form>
</div>
</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('.otp-input');
            const form = document.getElementById('otp-form');
            
            // Auto-focus logic for OTP inputs
            inputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    // Ensure only 1 digit
                    if (e.target.value.length > 1) {
                        e.target.value = e.target.value.slice(0, 1);
                    }
                    
                    // Move to next input if digit entered
                    if (e.target.value !== '' && index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                });

                input.addEventListener('keydown', (e) => {
                    // Move to previous input on backspace if empty
                    if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                        inputs[index - 1].focus();
                    }
                });
            });

            // Prevent default form submission for demo
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                let code = '';
                inputs.forEach(input => code += input.value);
                if (code.length === 4) {
                    console.log('Verifying code:', code);
                    // Add success animation or transition here
                    form.querySelector('button[type="submit"]').innerHTML = '<span class="material-symbols-outlined animate-spin mr-2">progress_activity</span> Verifying...';
                    setTimeout(() => {
                        form.querySelector('button[type="submit"]').innerHTML = 'Verify & Continue';
                    }, 2000);
                }
            });

            // Timer logic
            let timeLeft = 59;
            const timerEl = document.getElementById('timer');
            const resendBtn = document.getElementById('resend-btn');
            
            const timerId = setInterval(() => {
                timeLeft--;
                const seconds = timeLeft.toString().padStart(2, '0');
                timerEl.textContent = `0:${seconds}`;
                
                if (timeLeft <= 0) {
                    clearInterval(timerId);
                    timerEl.parentElement.classList.add('hidden');
                    resendBtn.classList.remove('hidden');
                }
            }, 1000);

            resendBtn.addEventListener('click', () => {
                console.log('Resending code...');
                // Reset timer for demo
                timeLeft = 59;
                timerEl.textContent = `0:59`;
                timerEl.parentElement.classList.remove('hidden');
                resendBtn.classList.add('hidden');
            });
        });
    </script>
</body></html>

<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>

<title>RozgarNow - Forgot Password</title>

<style>
        body { font-family: 'Work Sans', sans-serif; }
    </style>

<body class="bg-background text-on-background min-h-screen flex flex-col antialiased">
<!-- Top App Bar (Simplified for transactional page) -->
<header class="w-full top-0 sticky bg-surface border-b border-outline-variant flat no shadows flex justify-between items-center px-margin-mobile py-sm w-full z-50">
<button class="text-on-surface-variant hover:bg-surface-container-low active:opacity-80 transition-opacity rounded-full p-2 flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<div class="font-headline-md text-headline-md font-bold text-primary">RozgarNow</div>
<div class="w-[40px]"></div> <!-- Spacer to balance back button -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col justify-center px-margin-mobile py-lg max-w-md mx-auto w-full">
<div class="bg-surface-container-lowest rounded-xl shadow-sm p-lg w-full flex flex-col gap-lg border border-outline-variant/30">
<div class="text-center space-y-sm">
<div class="w-16 h-16 bg-primary-container/20 rounded-full flex items-center justify-center mx-auto mb-md">
<span class="material-symbols-outlined text-primary text-[32px]" data-icon="lock_reset" style="font-variation-settings: 'FILL' 0;">lock_reset</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-background">Forgot Password?</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Enter your phone number to receive a verification code.</p>
</div>
<form class="space-y-lg mt-md">
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface block" for="phone">Phone Number</label>
<div class="relative">
<span class="absolute left-3 top-1/2 -translate-y-1/2 font-body-lg text-body-lg text-on-surface-variant flex items-center">
                            +92 <span class="mx-2 text-outline-variant">|</span>
</span>
<input class="w-full pl-[72px] pr-4 py-3 bg-surface border border-outline-variant rounded-lg font-body-lg text-body-lg text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all placeholder:text-outline" id="phone" name="phone" placeholder="300 1234567" type="tel"/>
</div>
</div>
<button class="w-full bg-[#16A34A] text-on-primary font-label-md text-label-md py-3 px-4 rounded-lg flex items-center justify-center gap-sm hover:bg-[#15803d] active:scale-95 transition-all shadow-sm" type="button">
                    Send Code
                    <span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</form>
<div class="text-center mt-sm">
<a class="font-label-md text-label-md text-primary hover:underline underline-offset-4 decoration-2" href="#">Back to Login</a>
</div>
</div>
</main>
<!-- Navigation shell suppressed for transactional screen per protocol -->
</body></html>

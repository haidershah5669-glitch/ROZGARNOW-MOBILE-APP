<style>
        .loader {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid #ffffff;
            width: 32px;
            height: 32px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>

<body class="bg-primary m-0 p-0 h-screen w-screen overflow-hidden flex flex-col items-center justify-center relative font-body-lg">
<!-- Background Animation -->

<!-- Overlay for better contrast if needed, relying mostly on the primary color and shader -->
<div class="absolute inset-0 bg-primary/20 z-10"></div>
<!-- Main Content Container -->
<main class="z-20 flex flex-col items-center justify-between h-full py-24 px-6 w-full max-w-md mx-auto text-center">
<!-- Top spacer -->
<div class="flex-1"></div>
<!-- Center Brand -->
<div class="flex flex-col items-center justify-center space-y-4 animate-fade-in-up">
<!-- Brand Logo / Name -->
<h1 class="font-headline-lg text-[40px] leading-[48px] text-on-primary tracking-tight font-bold drop-shadow-md">

<!-- Tagline -->

            </p>
</div>
<!-- Bottom Loader & Spacer -->
<div class="flex-1 flex flex-col justify-end items-center pb-12 w-full">
<div class="loader mb-4"></div>
<p class="font-label-sm text-on-primary/60 uppercase tracking-widest">Loading...</p>
</div>
</main>
<script>
        // Simple fade-in animation logic if Tailwind class isn't defined
        document.addEventListener('DOMContentLoaded', () => {
            const mainContent = document.querySelector('main');
            mainContent.style.opacity = '0';
            mainContent.style.transform = 'translateY(20px)';
            mainContent.style.transition = 'opacity 0.8s ease-out, transform 0.8s ease-out';
            
            setTimeout(() => {
                mainContent.style.opacity = '1';
                mainContent.style.transform = 'translateY(0)';
            }, 100);
            
            // Redirect simulation
            setTimeout(() => {
                // window.location.href = '/home'; // Simulated redirect
                console.log("App ready. Redirecting...");
            }, 3000);
        });
    </script>

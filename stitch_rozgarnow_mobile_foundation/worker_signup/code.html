<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create Worker Account - RozgarNow</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-container": "#f7fff2",
                        "on-tertiary": "#ffffff",
                        "surface-container-low": "#eff6ea",
                        "inverse-surface": "#2b322b",
                        "secondary-fixed": "#ffdbca",
                        "on-tertiary-fixed-variant": "#8a143c",
                        "inverse-on-surface": "#ecf3e7",
                        "on-secondary-fixed": "#341100",
                        "on-surface": "#171d16",
                        "surface-bright": "#f4fcf0",
                        "surface-dim": "#d5dcd1",
                        "outline": "#6e7b6c",
                        "inverse-primary": "#62df7d",
                        "surface-variant": "#dde5d9",
                        "surface": "#f4fcf0",
                        "on-primary-fixed-variant": "#005320",
                        "on-background": "#171d16",
                        "on-secondary-container": "#5c2400",
                        "secondary": "#9d4300",
                        "tertiary": "#a72d51",
                        "on-secondary-fixed-variant": "#783200",
                        "tertiary-container": "#c74668",
                        "background": "#f4fcf0",
                        "surface-tint": "#006e2d",
                        "tertiary-fixed": "#ffd9de",
                        "on-secondary": "#ffffff",
                        "outline-variant": "#bdcaba",
                        "secondary-fixed-dim": "#ffb690",
                        "surface-container-highest": "#dde5d9",
                        "on-tertiary-container": "#fffbff",
                        "tertiary-fixed-dim": "#ffb2bf",
                        "primary-container": "#00873a",
                        "on-primary-fixed": "#002109",
                        "error-container": "#ffdad6",
                        "surface-container-lowest": "#ffffff",
                        "on-error-container": "#93000a",
                        "on-primary": "#ffffff",
                        "surface-container-high": "#e3eadf",
                        "error": "#ba1a1a",
                        "surface-container": "#e9f0e5",
                        "primary-fixed-dim": "#62df7d",
                        "primary": "#006b2c",
                        "on-error": "#ffffff",
                        "secondary-container": "#fd761a",
                        "on-surface-variant": "#3e4a3d",
                        "on-tertiary-fixed": "#3f0016",
                        "primary-fixed": "#7ffc97"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "8px",
                        "gutter-mobile": "12px",
                        "margin-mobile": "16px",
                        "xs": "4px",
                        "md": "16px",
                        "xl": "32px",
                        "base": "4px",
                        "lg": "24px"
                    },
                    "fontFamily": {
                        "body-lg": ["Work Sans"],
                        "label-sm": ["Work Sans"],
                        "headline-md": ["Work Sans"],
                        "headline-lg": ["Work Sans"],
                        "body-sm": ["Work Sans"],
                        "body-md": ["Work Sans"],
                        "headline-sm": ["Work Sans"],
                        "label-md": ["Work Sans"]
                    },
                    "fontSize": {
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.03em", "fontWeight": "600" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md antialiased h-screen flex flex-col">
<!-- TopAppBar (Transactional - Hidden Nav Shell per rules, but header is kept for brand) -->
<header class="w-full top-0 sticky bg-surface border-b border-outline-variant flex justify-between items-center px-margin-mobile py-sm z-50">
<button class="text-on-surface-variant hover:bg-surface-container-low rounded-full p-2 active:opacity-80 transition-opacity flex items-center justify-center" type="button">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="font-headline-md text-headline-md font-bold text-primary tracking-tight">RozgarNow</div>
<div class="w-10"></div> <!-- Spacer for balance -->
</header>
<main class="flex-grow overflow-y-auto w-full max-w-lg mx-auto px-margin-mobile py-lg pb-xl flex flex-col items-center">
<!-- Header Section -->
<div class="text-center w-full mb-lg">
<h1 class="font-headline-lg text-headline-lg text-on-background mb-xs">Create Worker Account</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Find jobs and earn money as a skilled worker.</p>
</div>
<!-- Form Section -->
<form class="w-full flex flex-col gap-md">
<!-- Profile Photo Upload -->
<div class="flex flex-col items-center justify-center w-full mb-sm">
<div class="relative group cursor-pointer">
<div class="w-24 h-24 rounded-full bg-surface-container border-2 border-dashed border-outline-variant flex items-center justify-center overflow-hidden hover:border-primary transition-colors">
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary text-[32px]" data-icon="photo_camera">photo_camera</span>
<!-- Hidden File Input would go here -->
</div>
<div class="absolute bottom-0 right-0 bg-primary text-on-primary rounded-full p-1 shadow-sm border-2 border-surface">
<span class="material-symbols-outlined text-[16px]" data-icon="add">add</span>
</div>
</div>
<span class="font-label-md text-label-md text-on-surface-variant mt-sm">Profile Photo (Optional)</span>
</div>
<!-- Full Name -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="fullName">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant" data-icon="person">person</span>
<input class="w-full bg-surface border border-outline-variant rounded-lg pl-10 pr-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="fullName" placeholder="e.g. Ahmed Khan" type="text"/>
</div>
</div>
<!-- Phone -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="phone">Phone</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant" data-icon="phone">phone</span>
<input class="w-full bg-surface border border-outline-variant rounded-lg pl-10 pr-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="phone" placeholder="03xx xxxxxxx" type="tel"/>
</div>
</div>
<!-- City & Area -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="location">City &amp; Area</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant" data-icon="location_on">location_on</span>
<input class="w-full bg-surface border border-outline-variant rounded-lg pl-10 pr-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="location" placeholder="e.g. Gulberg, Lahore" type="text"/>
</div>
</div>
<!-- Experience Dropdown -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="experience">Experience</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant" data-icon="work_history">work_history</span>
<select class="w-full bg-surface border border-outline-variant rounded-lg pl-10 pr-10 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors appearance-none" id="experience">
<option disabled="" selected="" value="">Select your experience level</option>
<option value="1-2">1-2 years</option>
<option value="3-5">3-5 years</option>
<option value="5+">5+ years</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none" data-icon="arrow_drop_down">arrow_drop_down</span>
</div>
</div>
<!-- Skills Multi-select (Visual Mockup) -->
<div class="flex flex-col gap-xs mt-sm">
<label class="font-label-md text-label-md text-on-surface flex justify-between items-center">
                    Skills
                    <span class="font-body-sm text-body-sm text-on-surface-variant font-normal">Select up to 5</span>
</label>
<div class="flex flex-wrap gap-2">
<button class="bg-primary-container/10 text-primary border border-primary rounded-full px-4 py-1.5 font-label-md text-label-md flex items-center gap-1 transition-colors" type="button">
                        Electrician
                        <span class="material-symbols-outlined text-[16px]" data-icon="check">check</span>
</button>
<button class="bg-surface border border-outline-variant text-on-surface-variant hover:border-primary hover:text-primary rounded-full px-4 py-1.5 font-label-md text-label-md transition-colors" type="button">
                        Plumbing
                    </button>
<button class="bg-primary-container/10 text-primary border border-primary rounded-full px-4 py-1.5 font-label-md text-label-md flex items-center gap-1 transition-colors" type="button">
                        Carpentry
                        <span class="material-symbols-outlined text-[16px]" data-icon="check">check</span>
</button>
<button class="bg-surface border border-outline-variant text-on-surface-variant hover:border-primary hover:text-primary rounded-full px-4 py-1.5 font-label-md text-label-md transition-colors" type="button">
                        Masonry
                    </button>
<button class="bg-surface border border-outline-variant text-on-surface-variant hover:border-primary hover:text-primary rounded-full px-4 py-1.5 font-label-md text-label-md transition-colors" type="button">
                        Painting
                    </button>
<button class="bg-surface border border-dashed border-outline-variant text-on-surface-variant hover:border-primary hover:text-primary rounded-full px-4 py-1.5 font-label-md text-label-md flex items-center gap-1 transition-colors" type="button">
<span class="material-symbols-outlined text-[16px]" data-icon="add">add</span> More
                    </button>
</div>
</div>
<!-- Bio -->
<div class="flex flex-col gap-xs mt-sm">
<label class="font-label-md text-label-md text-on-surface" for="bio">Bio</label>
<textarea class="w-full bg-surface border border-outline-variant rounded-lg p-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors resize-none" id="bio" placeholder="Tell employers a bit about yourself and your work ethic..." rows="3"></textarea>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary rounded-lg py-3 mt-md font-headline-sm text-headline-sm hover:opacity-90 active:scale-[0.98] transition-all shadow-sm flex items-center justify-center gap-2" type="button">
                Register
                <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
<!-- Login Link -->
<div class="text-center mt-sm pb-xl">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Already have an account? 
                    <a class="text-primary font-label-md hover:underline" href="#">Login</a>
</p>
</div>
</form>
</main>
</body></html>

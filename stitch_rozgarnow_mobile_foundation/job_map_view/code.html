<script>
        function showJobCard(cardId) {
            const container = document.getElementById('job-card-container');
            const allCards = container.querySelectorAll('> div');
            
            // Hide all cards first
            allCards.forEach(card => card.classList.add('hidden'));
            
            // Show container and specific card
            container.classList.remove('hidden');
            const selectedCard = document.getElementById(cardId);
            if(selectedCard) {
                selectedCard.classList.remove('hidden');
                // Re-trigger animation
                selectedCard.classList.remove('card-enter');
                void selectedCard.offsetWidth; // trigger reflow
                selectedCard.classList.add('card-enter');
            }
        }

        function hideJobCard(event) {
            event.stopPropagation();
            document.getElementById('job-card-container').classList.add('hidden');
        }
    </script>

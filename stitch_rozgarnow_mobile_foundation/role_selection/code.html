<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Role Selection - RozgarNow</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-container": "#f7fff2",
                        "on-tertiary": "#ffffff",
                        "surface-container-low": "#eff6ea",
                        "inverse-surface": "#2b322b",
                        "secondary-fixed": "#ffdbca",
                        "on-tertiary-fixed-variant": "#8a143c",
                        "inverse-on-surface": "#ecf3e7",
                        "on-secondary-fixed": "#341100",
                        "on-surface": "#171d16",
                        "surface-bright": "#f4fcf0",
                        "surface-dim": "#d5dcd1",
                        "outline": "#6e7b6c",
                        "inverse-primary": "#62df7d",
                        "surface-variant": "#dde5d9",
                        "surface": "#f4fcf0",
                        "on-primary-fixed-variant": "#005320",
                        "on-background": "#171d16",
                        "on-secondary-container": "#5c2400",
                        "secondary": "#9d4300",
                        "tertiary": "#a72d51",
                        "on-secondary-fixed-variant": "#783200",
                        "tertiary-container": "#c74668",
                        "background": "#f4fcf0",
                        "surface-tint": "#006e2d",
                        "tertiary-fixed": "#ffd9de",
                        "on-secondary": "#ffffff",
                        "outline-variant": "#bdcaba",
                        "secondary-fixed-dim": "#ffb690",
                        "surface-container-highest": "#dde5d9",
                        "on-tertiary-container": "#fffbff",
                        "tertiary-fixed-dim": "#ffb2bf",
                        "primary-container": "#00873a",
                        "on-primary-fixed": "#002109",
                        "error-container": "#ffdad6",
                        "surface-container-lowest": "#ffffff",
                        "on-error-container": "#93000a",
                        "on-primary": "#ffffff",
                        "surface-container-high": "#e3eadf",
                        "error": "#ba1a1a",
                        "surface-container": "#e9f0e5",
                        "primary-fixed-dim": "#62df7d",
                        "primary": "#006b2c",
                        "on-error": "#ffffff",
                        "secondary-container": "#fd761a",
                        "on-surface-variant": "#3e4a3d",
                        "on-tertiary-fixed": "#3f0016",
                        "primary-fixed": "#7ffc97"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "8px",
                        "gutter-mobile": "12px",
                        "margin-mobile": "16px",
                        "xs": "4px",
                        "md": "16px",
                        "xl": "32px",
                        "base": "4px",
                        "lg": "24px"
                    },
                    "fontFamily": {
                        "body-lg": ["Work Sans"],
                        "label-sm": ["Work Sans"],
                        "headline-md": ["Work Sans"],
                        "headline-lg": ["Work Sans"],
                        "body-sm": ["Work Sans"],
                        "body-md": ["Work Sans"],
                        "headline-sm": ["Work Sans"],
                        "label-md": ["Work Sans"]
                    },
                    "fontSize": {
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.03em", "fontWeight": "600" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        .role-card {
            transition: all 0.3s ease;
        }
        .role-card.selected {
            border-color: #006b2c; /* primary */
            background-color: #f7fff2; /* on-primary-container */
        }
        .checkmark-icon {
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .role-card.selected .checkmark-icon {
            opacity: 1;
            transform: scale(1);
        }
        .btn-continue:disabled {
            background-color: #bdcaba; /* outline-variant */
            color: #ffffff;
            cursor: not-allowed;
            opacity: 0.7;
        }
    </style>
</head>
<body class="bg-background min-h-screen flex flex-col items-center justify-center p-margin-mobile">
<!-- Top App Bar - Simple version for transactional screen -->
<header class="w-full top-0 fixed flex justify-between items-center px-margin-mobile py-sm bg-surface">
<div class="flex items-center">
<span class="material-symbols-outlined text-primary font-headline-md mr-sm" data-icon="arrow_back">arrow_back</span>
</div>
<h1 class="font-headline-md text-headline-md font-bold text-primary">RozgarNow</h1>
<div class="w-6 h-6"></div> <!-- Spacer for centering -->
</header>
<main class="w-full max-w-md flex flex-col items-center mt-xl">
<div class="text-center mb-xl">
<h2 class="font-headline-lg text-headline-lg text-on-background mb-sm">What brings you to RozgarNow?</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Tell us how you plan to use the app so we can tailor your experience.</p>
</div>
<div class="w-full flex flex-col gap-lg mb-xl">
<!-- Card 1: Worker -->
<button class="role-card relative w-full text-left bg-surface-container-lowest border border-outline-variant rounded-xl p-md flex flex-col items-start shadow-sm focus:outline-none" id="card-worker" onclick="selectRole('worker')">
<div class="flex items-center justify-between w-full mb-sm">
<div class="bg-primary-container/10 p-sm rounded-lg text-primary">
<span class="material-symbols-outlined" data-icon="handyman" style="font-size: 32px;">handyman</span>
</div>
<div class="checkmark-icon text-secondary-container">
<span class="material-symbols-outlined" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
<h3 class="font-headline-sm text-headline-sm text-on-surface mb-xs">I Want Work</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant">Find jobs and earn money as a skilled worker.</p>
</button>
<!-- Card 2: Employer -->
<button class="role-card relative w-full text-left bg-surface-container-lowest border border-outline-variant rounded-xl p-md flex flex-col items-start shadow-sm focus:outline-none" id="card-employer" onclick="selectRole('employer')">
<div class="flex items-center justify-between w-full mb-sm">
<div class="bg-primary-container/10 p-sm rounded-lg text-primary">
<span class="material-symbols-outlined" data-icon="person_search" style="font-size: 32px;">person_search</span>
</div>
<div class="checkmark-icon text-secondary-container">
<span class="material-symbols-outlined" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
<h3 class="font-headline-sm text-headline-sm text-on-surface mb-xs">I Want to Hire</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant">Find and hire the best workers for your needs.</p>
</button>
</div>
<div class="w-full mt-auto mb-md fixed bottom-0 left-0 px-margin-mobile pb-margin-mobile max-w-md mx-auto right-0">
<button class="btn-continue w-full bg-primary text-on-primary font-label-md text-label-md py-md rounded-lg shadow-sm transition-colors" disabled="" id="btn-continue">
                Continue
            </button>
</div>
</main>
<script>
        function selectRole(role) {
            // Reset all cards
            document.getElementById('card-worker').classList.remove('selected');
            document.getElementById('card-employer').classList.remove('selected');
            document.getElementById('card-worker').style.borderWidth = '1px';
            document.getElementById('card-employer').style.borderWidth = '1px';

            // Highlight selected card
            const selectedCard = document.getElementById('card-' + role);
            selectedCard.classList.add('selected');
            selectedCard.style.borderWidth = '2px';

            // Enable continue button
            const btnContinue = document.getElementById('btn-continue');
            btnContinue.disabled = false;
        }
    </script>
</body></html>

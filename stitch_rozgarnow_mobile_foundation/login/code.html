<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>RozgarNow - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-container": "#f7fff2",
                        "on-tertiary": "#ffffff",
                        "surface-container-low": "#eff6ea",
                        "inverse-surface": "#2b322b",
                        "secondary-fixed": "#ffdbca",
                        "on-tertiary-fixed-variant": "#8a143c",
                        "inverse-on-surface": "#ecf3e7",
                        "on-secondary-fixed": "#341100",
                        "on-surface": "#171d16",
                        "surface-bright": "#f4fcf0",
                        "surface-dim": "#d5dcd1",
                        "outline": "#6e7b6c",
                        "inverse-primary": "#62df7d",
                        "surface-variant": "#dde5d9",
                        "surface": "#f4fcf0",
                        "on-primary-fixed-variant": "#005320",
                        "on-background": "#171d16",
                        "on-secondary-container": "#5c2400",
                        "secondary": "#9d4300",
                        "tertiary": "#a72d51",
                        "on-secondary-fixed-variant": "#783200",
                        "tertiary-container": "#c74668",
                        "background": "#f4fcf0",
                        "surface-tint": "#006e2d",
                        "tertiary-fixed": "#ffd9de",
                        "on-secondary": "#ffffff",
                        "outline-variant": "#bdcaba",
                        "secondary-fixed-dim": "#ffb690",
                        "surface-container-highest": "#dde5d9",
                        "on-tertiary-container": "#fffbff",
                        "tertiary-fixed-dim": "#ffb2bf",
                        "primary-container": "#00873a",
                        "on-primary-fixed": "#002109",
                        "error-container": "#ffdad6",
                        "surface-container-lowest": "#ffffff",
                        "on-error-container": "#93000a",
                        "on-primary": "#ffffff",
                        "surface-container-high": "#e3eadf",
                        "error": "#ba1a1a",
                        "surface-container": "#e9f0e5",
                        "primary-fixed-dim": "#62df7d",
                        "primary": "#006b2c",
                        "on-error": "#ffffff",
                        "secondary-container": "#fd761a",
                        "on-surface-variant": "#3e4a3d",
                        "on-tertiary-fixed": "#3f0016",
                        "primary-fixed": "#7ffc97"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "8px",
                        "gutter-mobile": "12px",
                        "margin-mobile": "16px",
                        "xs": "4px",
                        "md": "16px",
                        "xl": "32px",
                        "base": "4px",
                        "lg": "24px"
                    },
                    "fontFamily": {
                        "body-lg": ["Work Sans"],
                        "label-sm": ["Work Sans"],
                        "headline-md": ["Work Sans"],
                        "headline-lg": ["Work Sans"],
                        "body-sm": ["Work Sans"],
                        "body-md": ["Work Sans"],
                        "headline-sm": ["Work Sans"],
                        "label-md": ["Work Sans"]
                    },
                    "fontSize": {
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.03em", "fontWeight": "600" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">
<!-- Top AppBar (Simplified for Login) -->
<header class="bg-surface w-full top-0 sticky z-50 flex justify-between items-center px-margin-mobile py-sm border-b border-outline-variant flat no shadows">
<button class="text-on-surface-variant hover:bg-surface-container-low active:opacity-80 transition-opacity p-2 rounded-full flex items-center justify-center" type="button">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="font-headline-md text-headline-md font-bold text-primary">RozgarNow</div>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile py-xl w-full max-w-md mx-auto">
<div class="w-full text-center mb-lg">
<h1 class="font-headline-lg text-headline-lg text-on-background mb-xs">Welcome Back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Login to continue your journey.</p>
</div>
<form class="w-full flex flex-col gap-md">
<!-- Phone Number Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-background" for="phone">Phone Number</label>
<div class="flex items-center border border-outline-variant rounded-lg overflow-hidden focus-within:border-primary focus-within:ring-1 focus-within:ring-primary bg-surface transition-colors duration-200">
<div class="flex items-center pl-sm pr-xs py-sm border-r border-outline-variant bg-surface-container-lowest">
<span class="font-body-md text-body-md text-on-surface-variant mr-1">+92</span>
<span class="material-symbols-outlined text-[16px] text-on-surface-variant" data-icon="arrow_drop_down">arrow_drop_down</span>
</div>
<input class="flex-grow font-body-md text-body-md px-sm py-sm border-none focus:ring-0 bg-transparent text-on-background placeholder-outline" id="phone" name="phone" placeholder="300 1234567" required="" type="tel"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-background" for="password">Password</label>
<div class="flex items-center border border-outline-variant rounded-lg overflow-hidden focus-within:border-primary focus-within:ring-1 focus-within:ring-primary bg-surface transition-colors duration-200 relative">
<input class="flex-grow font-body-md text-body-md pl-sm pr-10 py-sm border-none focus:ring-0 bg-transparent text-on-background placeholder-outline" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-sm text-on-surface-variant p-1 rounded hover:bg-surface-container-low transition-colors duration-150 flex items-center justify-center" onclick="const p=document.getElementById('password'); const i=this.querySelector('span'); if(p.type==='password'){p.type='text'; i.textContent='visibility_off';}else{p.type='password'; i.textContent='visibility';}" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
<div class="flex justify-end mt-1">
<a class="font-body-sm text-body-sm text-secondary-container hover:underline font-medium" href="#">Forgot Password?</a>
</div>
</div>
<!-- Login Button -->
<button class="w-full bg-primary text-on-primary font-headline-sm text-headline-sm py-sm rounded-lg shadow-sm hover:bg-surface-tint active:scale-95 transition-all duration-150 mt-sm flex items-center justify-center" type="submit">
                Login
            </button>
<!-- Sign Up Link -->
<div class="text-center mt-md">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Don't have an account? <a class="text-primary font-semibold hover:underline" href="#">Sign Up</a>
</p>
</div>
</form>
<!-- Demo Login Section -->
<div class="w-full mt-xl pt-lg border-t border-outline-variant/30 flex flex-col gap-sm">
<p class="font-label-sm text-label-sm text-on-surface-variant uppercase text-center mb-xs tracking-wider">Demo Access</p>
<button class="w-full border border-primary text-primary bg-transparent font-label-md text-label-md py-2 rounded-lg hover:bg-primary-container/10 active:scale-95 transition-all duration-150 flex items-center justify-center gap-sm" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="work">work</span>
                Continue as Worker
            </button>
<button class="w-full border border-primary text-primary bg-transparent font-label-md text-label-md py-2 rounded-lg hover:bg-primary-container/10 active:scale-95 transition-all duration-150 flex items-center justify-center gap-sm" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="business">business</span>
                Continue as Employer
            </button>
<button class="w-full border border-outline text-on-surface-variant bg-transparent font-label-md text-label-md py-2 rounded-lg hover:bg-surface-container-low active:scale-95 transition-all duration-150 flex items-center justify-center gap-sm" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="admin_panel_settings">admin_panel_settings</span>
                Continue as Admin
            </button>
</div>
</main>
</body></html>

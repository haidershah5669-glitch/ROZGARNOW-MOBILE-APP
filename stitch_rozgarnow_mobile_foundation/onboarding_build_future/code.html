<!DOCTYPE html>

            background-color: theme('colors.background');
            color: theme('colors.on-background');

<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline>

<line x1="12" x2="12" y1="20" y2="20.01"></line>

<div class="absolute bottom-12 left-8 w-16 h-16 bg-secondary-container/10 rounded-full blur-md"></div>

<p class="font-body-lg text-body-lg text-on-surface-variant max-w-xs mx-auto">

                </p>
</div>
</div>

<div class="flex flex-col w-full pb-safe mb-md gap-lg">

<div class="flex justify-center items-center gap-2 mb-4">
<div class="w-2 h-2 rounded-full bg-outline-variant transition-colors duration-300"></div>
<div class="w-2 h-2 rounded-full bg-outline-variant transition-colors duration-300"></div>
<div class="w-8 h-2 rounded-full bg-primary transition-all duration-300"></div>
</div>

<button aria-label="Get Started" class="w-full bg-[#16A34A] text-[#FFFFFF] font-label-md text-label-md py-4 rounded-lg shadow-sm hover:bg-[#15803d] active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2">
<span>Get Started</span>
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>

<div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
<div class="absolute -top-24 -right-24 w-64 h-64 bg-primary-container/20 rounded-full blur-3xl opacity-50"></div>

<div class="absolute bottom-0 left-0 -mb-20 -ml-20 w-80 h-80 bg-secondary-container rounded-full mix-blend-multiply filter blur-3xl opacity-10 pointer-events-none"></div>

<div class="absolute inset-0 bg-gradient-to-tr from-surface-container to-surface-container-lowest rounded-full scale-90 opacity-60"></div>
<img alt="Illustration of a worker finding jobs on a map" class="w-full h-full object-contain relative z-10 drop-shadow-xl" data-alt="A clean, modern, flat-vector style illustration showing a confident construction worker or plumber standing next to an oversized stylized map. The worker is wearing safety gear. The map has glowing destination pins in vibrant green. The background is minimal, white, with soft geometric shapes in muted light green and subtle orange accents to convey finding local jobs easily. High-quality professional corporate vector art style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBAE9WEC6Z2mu1rHO0vnncW2F6hA5dWKCgxUJbSWPOD_Eyw_uykfR62Evq6cSMalyHjoZobQmQw0C9wfy-EsHCxibRLbm13n9wUPXEJadIoqzZBb6UGw_AJLY5sFscHA72g0jyun4LY5WIElgla6JO0PENpcdElkO_WVIy_DuSTKb74igwlRZ6VNCN4FRUHlJQWxHSJYRBvU-FHSGEqPy-7KZN1k7l1gmOswdSgECkcXPAVrlfRpLA"/>

<h1 class="font-headline-lg text-headline-lg text-on-background mb-sm">
                    Find Work Near You
                </h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                    Discover job opportunities in your own neighborhood. From plumbing to electrical work, find the right task today.
                </p>
</div>
<div class="flex-1"></div>
</main>

<div class="w-full px-margin-mobile pb-lg pt-md bg-gradient-to-t from-surface-container-lowest via-surface-container-lowest to-transparent flex flex-col items-center gap-lg fade-in delay-300 absolute bottom-0">
<div class="flex items-center justify-between w-full">
<!-- Pagination Dots -->
<div class="flex gap-2 items-center pl-2">
<div aria-current="step" class="w-8 h-2 rounded-full bg-primary transition-all duration-300"></div>
<div class="w-2 h-2 rounded-full bg-surface-variant transition-all duration-300"></div>
<div class="w-2 h-2 rounded-full bg-surface-variant transition-all duration-300"></div>
</div>
<!-- Next Button -->
<button class="bg-primary hover:bg-surface-tint active:scale-95 text-on-primary font-label-md text-label-md px-6 py-3 rounded-full flex items-center gap-2 transition-all shadow-md hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background">
                    Next
                    <span aria-hidden="true" class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0, 'wght' 400;">arrow_forward</span>
</button>
</div>
</div>
</div>
<!-- Script for interactive button effect -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const nextBtn = document.querySelector('button.bg-primary');
            if(nextBtn) {
                nextBtn.addEventListener('click', function(e) {
                    // Simple ripple or scale effect could be added here, though Tailwind handles the basics.
                    this.classList.add('scale-95');
                    setTimeout(() => {
                        this.classList.remove('scale-95');
                    }, 150);
                });
            }
        });
    </script>
